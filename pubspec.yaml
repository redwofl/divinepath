name: divine_path_ai
description: "DivinePath AI - Your Spiritual Companion App"
publish_to: 'none'
version: 1.2.0+4

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.5
  google_sign_in: ^6.2.2

  # Google AI (Gemini)
  google_generative_ai: ^0.4.6

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.2

  # Storage
  shared_preferences: ^2.3.3

  # UI Components
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  avatar_glow: ^3.0.1
  percent_indicator: ^4.2.3
  fl_chart: ^0.69.2
  lottie: ^3.1.3
  cached_network_image: ^3.4.1
  glassmorphism: ^3.0.0
  animate_do: ^3.3.4
  flutter_animate: ^4.5.2
  flutter_staggered_animations: ^1.1.0
  smooth_page_indicator: ^1.2.1
  page_transition: ^2.1.0
  flutter_native_splash: ^2.4.1

  # Ads (Start.io)
  startapp_sdk: ^1.0.1

  # Ads (Google AdMob — rewarded ads for the mala bonus)
  google_mobile_ads: ^6.0.0

  # Audio & Voice
  just_audio: ^0.9.40
  flutter_tts: ^4.1.0
  audioplayers: ^6.1.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Utilities
  path_provider: ^2.1.4
  intl: ^0.20.3
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.3
  vibration: ^2.0.1
  haptic_feedback: ^0.5.1
  uuid: ^4.5.1
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  collection: ^1.18.0
  device_info_plus: ^11.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#F17E03"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#F59E0B"
    theme_color: "#F59E0B"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"

flutter_native_splash:
  color: "#111827"
  image: assets/icons/splash_icon.png
  android: true
  ios: true
  web: true
  fullscreen: true
  android_12:
    image: assets/icons/splash_icon.png
    color: "#111827"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/deities/
    - assets/icons/
    - assets/sounds/
    - assets/animations/
    - assets/fonts/

  # Fonts are handled by google_fonts package at runtime
